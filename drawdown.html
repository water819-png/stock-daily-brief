      padding: 24px 28px;
      position: relative;
      overflow: hidden;

    .header-card::before {

      padding: 16px 18px;

      align-items: center;
      gap: 14px;

      border-radius: 999px;

      font-weight: 600;

      color: #fecdd3;
    }
    .search-box {

    }

      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 13px;

    let currentFilter = 'all';

    let currentPage = 1;
    const pageSize = 50;

    function getTierBadge(code) {
      switch(code) {
        case 'severe_40': return '<span class="tier-badge tier-severe">💀 崩跌腰斬</span>';
        case 'heavy_30': return '<span class="tier-badge tier-heavy">🩸 慘烈重災</span>';
        case 'bear_20': return '<span class="tier-badge tier-bear">📉 技術熊市</span>';
        case 'mild_10': return '<span class="tier-badge tier-mild">⚠️ 溫和回檔</span>';
        default: return '<span class="tier-badge tier-safe">🛡️ 逆勢抗跌</span>';
      }
    }

    function getDDClass(dd) {
      if (dd <= -40) return 'dd-severe';
      if (dd <= -30) return 'dd-heavy';
      if (dd <= -20) return 'dd-bear';
      if (dd <= -10) return 'dd-mild';
      return 'dd-safe';
    }

    function filterAndSort() {
      return ALL_DATA.filter(item => {
        if (currentFilter === 'severe_40' && item.tier_code !== 'severe_40') return false;
        if (currentFilter === 'heavy_30' && item.tier_code !== 'heavy_30') return false;
        if (currentFilter === 'strong_safe' && item.tier_code !== 'strong_safe') return false;
        if (currentFilter === 'mkt_twse' && item.market !== '上市') return false;
        if (currentFilter === 'mkt_tpex' && item.market !== '上櫃') return false;

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return item.code.toLowerCase().includes(q) || item.name.toLowerCase().includes(q);
        }
        return true;
      }).sort((a, b) => {
        let vA = a[sortKey];
        let vB = b[sortKey];
        if (typeof vA === 'string') return sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
        return sortAsc ? vA - vB : vB - vA;
      });
    }

    function renderTable() {
      const list = filterAndSort();
      const totalRows = list.length;
      const totalPages = Math.ceil(totalRows / pageSize) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize;
      const pageData = list.slice(start, start + pageSize);

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = pageData.map(d => `
        <tr>
          <td><span class="code-pill">${d.code}</span></td>
          <td class="stock-name">${d.name}</td>
          <td><span class="mkt-tag">${d.market}</span></td>
          <td class="price-num" style="color: #f8fafc; font-size: 15px;">${d.close.toFixed(2)}</td>
          <td class="price-num" style="color: var(--text-muted);">${d.high_1m.toFixed(2)}</td>
          <td class="dd-bar-cell ${getDDClass(d.dd_1m)}">${d.dd_1m > 0 ? '+' : ''}${d.dd_1m.toFixed(2)}%</td>
          <td class="price-num" style="color: var(--text-muted);">${d.high_3m.toFixed(2)}</td>
          <td class="dd-bar-cell ${getDDClass(d.dd_3m)}">${d.dd_3m > 0 ? '+' : ''}${d.dd_3m.toFixed(2)}%</td>
          <td>${getTierBadge(d.tier_code)}</td>
        </tr>
      `).join('');

      document.getElementById('pageInfo').textContent = `顯示第 ${start + 1} ~ ${Math.min(start + pageSize, totalRows)} 筆，共 ${totalRows} 筆 (第 ${currentPage} / ${totalPages} 頁)`;
      document.getElementById('btnPrev').disabled = currentPage <= 1;
      document.getElementById('btnNext').disabled = currentPage >= totalPages;
    }

    function changePage(delta) {
      currentPage += delta;
      renderTable();
      window.scrollTo({ top: 320, behavior: 'smooth' });
    }

    function handleSort(key) {
      if (sortKey === key) {
        sortAsc = !sortAsc;
      } else {
        sortKey = key;
        sortAsc = (key === 'dd_3m' || key === 'dd_1m') ? true : false;
      }
      currentPage = 1;
      renderTable();
    }

    document.querySelectorAll('#filterPills button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filterPills button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        currentPage = 1;
        renderTable();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      currentPage = 1;
      renderTable();
    });

    renderTable();
  </script>
