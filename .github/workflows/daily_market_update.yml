name: Daily Market & Institutional Flows Update

on:
  schedule:
    # 台灣時間週一至週五 18:08 自動執行 (UTC 10:08 = 台灣時間 18:08，避開 00 分整點排程壅塞)
    - cron: '8 10 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁隨時點擊「Run workflow」手動觸發

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載最新程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 抓取證交所官方大盤行情與三大法人籌碼
        run: |
          python update_daily_market.py

      - name: 💾 自動儲存並推播更新至 GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefs.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 自動更新：今日台股大盤與三大法人籌碼 [$(date +'%Y-%m-%d')]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "今日無數據變更，略過提交"
          fi
